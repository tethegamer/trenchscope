services:
  - type: web
    name: trenchscope
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_URL
        value: https://onthescope.fun
      # Optional: a private RPC (Helius/Triton/etc.) for dev-wallet SOL balances
      - key: SOLANA_RPC
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Owner wallet for Solana Pay (defaults to EL63Jz5kAamGAFtwiunvCJsFcAZWGUmagPTHZTrcPVv6)
      - key: PAY_WALLET
        value: EL63Jz5kAamGAFtwiunvCJsFcAZWGUmagPTHZTrcPVv6
      # X reply bot (docs/x-bot.md) — off until all four are set
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: X_BOT_HANDLE
        value: OnTheScope
      # Alerts: generate once with `npx web-push generate-vapid-keys` and paste both (keep the private key secret).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Telegram alerts bot token from @BotFather (alerts over Telegram stay off until set)
      - key: TELEGRAM_ALERTS_BOT_TOKEN
        sync: false
      # Buy on site (Jupiter Plugin) referral fee - see docs/jupiter-referral.md. Card works without it, just no fee.
      - key: JUP_REFERRAL_ACCOUNT
        sync: false
      - key: JUP_REFERRAL_FEE_BPS
        value: "50"
      # Exits (TP/SL, trailing stop, limit orders via Jupiter Trigger V2) - free key from https://portal.jup.ag.
      # Off until set. 0.5% fee (EXIT_FEE_BPS, default 50) is paid in SOL to EXIT_FEE_WALLET (default: PAY_WALLET).
      - key: JUP_API_KEY
        sync: false
      # Optional tuning (defaults in code): BOOST_MIN_SCORE=50 (boosts only sold at Scope Score >= this),
      # TRENDING_AD_SLOTS=3 (labelled AD rows pinned on top of Trending), EXIT_FEE_BPS=50, EXIT_FEE_WALLET.
