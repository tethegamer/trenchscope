services:
  - type: web
    name: trenchscope
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Optional: a private RPC (Helius/Triton/etc.) for dev-wallet SOL balances
      - key: SOLANA_RPC
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Owner wallet for Solana Pay (defaults to E4gJZ7k2eZDHNxZMWdnXu5XytwpkcYbeLzXXkKMMS8Qv)
      - key: SOL_RECIPIENT
        value: E4gJZ7k2eZDHNxZMWdnXu5XytwpkcYbeLzXXkKMMS8Qv
